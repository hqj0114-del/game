<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶可夢 3D 卡牌對戰</title>
    <style>
        /* 基礎設定與防呆機制 */
        * {
            box-sizing: border-box;
            user-select: none; /* 防止文字反白干擾遊玩 */
        }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: pan-y; /* 允許上下捲動，防止左右滑動造成網頁切換 */
            overflow-x: hidden;
        }

        h1 { text-align: center; color: #f1c40f; }

        /* 控制面板 */
        .controls { text-align: center; margin-bottom: 20px; z-index: 10; }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
            border-radius: 8px;
            transition: transform 0.1s, filter 0.2s;
        }
        
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #7f8c8d; border-color: #95a5a6; cursor: not-allowed; }
        
        #status-text { margin-top: 15px; font-weight: bold; font-size: 18px; color: #f39c12; }

        /* ==================== 階段一：3D 選卡畫面 ==================== */
        #phase1-container { width: 100%; display: flex; justify-content: center; }
        
        .scene {
            width: 260px;
            height: 380px;
            perspective: 1000px;
            margin-top: 50px;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }

        .carousel {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .card {
            position: absolute;
            width: 260px;
            height: 380px;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border: 4px solid #f1c40f;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            backface-visibility: hidden;
            pointer-events: none; /* 讓拖曳事件穿透到 carousel 進行判定 */
            color: #333;
        }

        .card img { width: 150px; height: 150px; object-fit: contain; pointer-events: none; }
        .card .name-zh { font-size: 22px; font-weight: bold; margin: 10px 0 5px; }
        .card .name-en { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; }
        .card .types { display: flex; gap: 8px; margin-bottom: 15px; }
        .card .type-badge {
            background-color: #34495e; color: white;
            padding: 4px 10px; border-radius: 6px; font-size: 12px;
        }
        .card .stats { width: 100%; display: flex; justify-content: space-around; font-weight: bold; margin-bottom: 15px; }
        .card .select-btn {
            pointer-events: auto; /* 恢復按鈕可點擊狀態 */
            background-color: #27ae60; border-color: #2ecc71;
            width: 80%; padding: 10px;
        }

        /* ==================== 階段二：戰鬥畫面 ==================== */
        #phase2-container { display: none; width: 100%; max-width: 900px; }
        
        .battle-arena {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .arena-player { order: 1; display: flex; flex-direction: column; align-items: center; }
        .arena-log { 
            order: 2; 
            flex: 1;
            height: 400px; 
            background-color: #000; 
            color: #fff; 
            border: 4px solid #7f8c8d;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 16px;
            line-height: 1.6;
        }
        .arena-opp { order: 3; display: flex; flex-direction: column; align-items: center; }

        .battle-card {
            width: 220px; height: 320px;
            background: white; color: #333;
            border-radius: 16px; border: 4px solid #bdc3c7;
            display: flex; flex-direction: column; align-items: center; padding: 15px;
        }
        .battle-card img { width: 120px; height: 120px; }
        .hp-bar { width: 100%; background: #ecf0f1; height: 12px; border-radius: 6px; margin-top: 10px; overflow: hidden; border: 1px solid #bdc3c7; }
        .hp-fill { height: 100%; background: #2ecc71; transition: width 0.3s ease, background-color 0.3s ease; }

        /* ==================== 響應式設計 (RWD) ==================== */
        @media (max-width: 768px) {
            .scene { 
                transform: scale(0.65); /* 縮小 3D 舞台防止跑版 */
                margin-top: 0;
            }
            .battle-arena { flex-direction: column; }
            /* 使用 Flexbox Order 重新排列戰鬥區塊 */
            .arena-opp { order: 1; }
            .arena-log { order: 2; width: 100%; height: 220px; }
            .arena-player { order: 3; }
        }
    </style>
</head>
<body>

    <h1>寶可夢 3D 對戰</h1>
    
    <div class="controls">
        <button id="draw-btn" disabled>抽取 5 張卡牌</button>
        <div id="status-text">正在下載全國中文圖鑑...</div>
    </div>

    <div id="phase1-container">
        <div class="scene">
            <div class="carousel" id="carousel">
                </div>
        </div>
    </div>

    <div id="phase2-container">
        <div class="battle-arena">
            <div class="arena-player">
                <h3 style="margin:5px; color:#3498db;">你的寶可夢</h3>
                <div id="player-card-slot"></div>
            </div>
            <div class="arena-log" id="battle-log">
                </div>
            <div class="arena-opp">
                <h3 style="margin:5px; color:#e74c3c;">對手</h3>
                <div id="opp-card-slot"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
